[package]
name = "diskonaut"
description = "Terminal disk space visual navigator"
version = "0.12.2"
authors = ["Aram Drevekenin <aram@poor.dev>", "Kevin Konrad <info@kevinkonrad.de"]
readme = "README.md"
homepage = "https://github.com/kfkonrad/diskonaut"
repository = "https://github.com/kfkonrad/diskonaut"
license = "MIT"
edition = "2024"

[dependencies]
ratatui = {version="0.30", default-features = false, features = ['crossterm'] }
crossterm = "0.29"
failure = "0.1"
jwalk = "0.8"
structopt = "0.3"
filesize = "0.2.0"
unicode-width = "0.2.2"
nix = { version = "0.31.2", features = ["user"] }
float-cmp = "0.10.0"
[target.'cfg(windows)'.dependencies]
is_elevated = "0.1.2"

[dev-dependencies]
insta = "1.47.2"

[profile.release]
opt-level = 'z'   # Optimize for size.
lto = true        # Enable Link Time Optimisation
codegen-units = 1 # Reduced to increase optimisations.
panic = 'abort'   # Abort on panic
strip = "symbols" # Strip symbols from binary

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
